# 全量 nginx 配置（覆盖镜像默认配置）
# 本服务只做 TCP 四层负载均衡，无需 http 模块，所以整个文件只有 stream 块

# events 块：nginx 必需的全局配置段
events {
    worker_connections 1024;
}

# stream 块：四层（TCP/UDP）流量代理，用于 nginx 之外的 TCP 负载均衡
stream {
    # 上游服务器组：宿主机上跑的两个 ChatServer 实例
    # host.docker.internal 由 compose 的 extra_hosts 解析到宿主机 IP
    upstream chatservers {
        server host.docker.internal:6000;
        server host.docker.internal:6001;
    }

    # 负载均衡入口：监听 8000 端口，轮询转发到两个 ChatServer
    server {
        listen 8000;
        proxy_pass chatservers;
    }
}
