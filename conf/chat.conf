; 聊天服务器连接配置
; 键值对格式：key=value，分号开头为注释
; 修改后需重启 ChatServer 进程生效
; 配置文件缺失或键不存在时，程序使用内置默认值

[mysql]
; MySQL 连接地址（默认 127.0.0.1，docker compose 部署时映射到宿主机）
host=127.0.0.1
; MySQL 端口
port=3306
; 连接用户名
user=root
; 连接密码（与 docker-compose.yml 中 MYSQL_ROOT_PASSWORD 保持一致）
password=123456
; 数据库名
dbname=chat

[redis]
; Redis 连接地址（默认 127.0.0.1，docker compose 部署时映射到宿主机）
host=127.0.0.1
; Redis 端口
port=6379
